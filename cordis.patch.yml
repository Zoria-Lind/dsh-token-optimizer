# dsh bundle layer: mount the token-optimizer plugin.
# The plugin package root export (src/index.js) is a Cordis plugin; the
# loader resolves the row by package name after the dsh-base layer inserts.
- insert:
    - id: token-optimizer
      name: '@zoria-lind/dsh-token-optimizer'
      config:
        # T4 分层压缩(默认关;启用时 src/index.js 会自动旁路 compactionDriver 的旧 0.45 阈值路径)
        layeredCompact:
          enabled: false
          lowRatio: 0.4
          midRatio: 0.5
          highRatio: 0.65
          highTierTimeoutMs: 120000
          highTierMaxPerSession: 2
          sessionWindowFallback: 262144
        toolTrim:
          enabled: true
          # 不再维护易过期的内置工具白名单；未配置 allow 时保留新工具。
          mcpLazy: true
        cache:
          enabled: false
        fileDiff:
          enabled: false
